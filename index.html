<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>오늘의 단어 - 대결 모드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK (Compat 버전) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; user-select: none; }
        .tile {
            width: 52px; height: 52px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; font-weight: 700; border-radius: 0.75rem;
            border: 2px solid #e2e8f0; background-color: #ffffff; color: #1e293b;
            transition: all 0.15s ease-in-out;
        }
        .tile.correct { background-color: #4ade80 !important; border-color: #4ade80 !important; color: white !important; }
        .tile.present { background-color: #facc15 !important; border-color: #facc15 !important; color: white !important; }
        .tile.absent { background-color: #94a3b8 !important; border-color: #94a3b8 !important; color: white !important; }
        .tile.filled { border-color: #64748b; transform: scale(1.03); }
        .key {
            background-color: #e2e8f0; color: #334155; font-weight: 600;
            border-radius: 0.5rem; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: background-color 0.1s; font-size: 0.95rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .key:active { background-color: #cbd5e1; transform: scale(0.95); }
        .key.correct { background-color: #4ade80 !important; color: white !important; }
        .key.present { background-color: #facc15 !important; color: white !important; }
        .key.absent { background-color: #94a3b8 !important; color: white !important; }
    </style>
</head>
<body class="flex flex-col min-h-screen text-slate-800">

    <!-- 상단 헤더 -->
    <header class="flex items-center justify-between px-4 py-3 bg-white border-b border-slate-200 shadow-sm">
        <div class="flex items-center space-x-2">
            <span class="px-2 py-1 bg-emerald-500 text-white font-black rounded text-lg tracking-wider">단</span>
            <h1 class="text-xl font-bold tracking-tight">오늘의 단어</h1>
            <span id="gameModeBadge" class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-medium">혼자 하기</span>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="openLobbyModal()" class="flex items-center space-x-1 px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-semibold transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                <span id="roomBtnText">대결 방</span>
            </button>
        </div>
    </header>

    <!-- 메인 게임 영역 -->
    <main class="flex-1 flex flex-col items-center justify-between max-w-md w-full mx-auto p-4">
        
        <!-- 대결 정보 바 -->
        <div id="multiplayerInfo" class="w-full bg-emerald-50 border border-emerald-200 rounded-xl p-3 mb-2 hidden">
            <div class="flex justify-between items-center text-sm">
                <div>방코드: <span id="dispRoomCode" class="font-bold text-emerald-700"></span></div>
                <div>출제자: <span id="dispMaster" class="font-bold text-emerald-700"></span></div>
            </div>
            <div id="masterNotice" class="text-xs text-emerald-600 mt-1 font-medium hidden">💡 당신은 이번 라운드 출제자입니다! 5자모 단어를 출제해주세요.</div>
        </div>

        <!-- 게임 보드 (5행 5열) -->
        <div id="board" class="grid grid-rows-5 gap-2 my-auto"></div>

        <!-- 출제자 전용 단어 입력창 -->
        <div id="wordSetterBox" class="w-full bg-amber-50 border border-amber-200 rounded-xl p-3 mb-3 hidden">
            <p class="text-xs font-bold text-amber-800 mb-1">🎯 이번 라운드 정답 단어 설정 (5자모)</p>
            <div class="flex space-x-2">
                <input type="text" id="customWordInput" maxlength="5" placeholder="예: ㅊㅗㅅㅜㄴ" class="flex-1 px-3 py-1.5 border border-amber-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-amber-400">
                <button onclick="setSecretWord()" class="px-4 py-1.5 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-lg text-sm transition">문제 출제</button>
            </div>
        </div>

        <!-- 출제자 관전 대시보드 -->
        <div id="spectatorDashboard" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 mb-3 hidden max-h-48 overflow-y-auto">
            <p class="text-xs font-bold text-slate-700 mb-2">👁️ 실시간 참가자 현황 관전 보드 (총 5회 시도)</p>
            <div id="playerStatusList" class="space-y-2"></div>
        </div>

        <!-- 키보드 영역 -->
        <div id="keyboard" class="w-full space-y-1.5 pb-2">
            <div class="flex justify-center space-x-1.5">
                <div class="key flex-1 py-3" onclick="handleKey('ㅂ')">ㅂ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㅈ')">ㅈ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㄷ')">ㄷ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㄱ')">ㄱ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㅅ')">ㅅ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㅛ')">ㅛ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㅕ')">ㅕ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㅑ')">ㅑ</div>
                <div class="key flex-1 py-3 bg-slate-300" onclick="handleDelete()"><svg class="w-5 h-5 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-8.172a2 2 0 00-1.414.586L3 12z"></path></svg></div>
            </div>
            <div class="flex justify-center space-x-1.5 px-2">
                <div class="key flex-1 py-3" onclick="handleKey('ㅁ')">ㅁ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㄴ')">ㄴ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㅇ')">ㅇ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㄹ')">ㄹ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㅎ')">ㅎ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㅗ')">ㅗ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㅓ')">ㅓ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㅏ')">ㅏ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㅣ')">ㅣ</div>
            </div>
            <div class="flex justify-center space-x-1.5">
                <div class="key flex-1 py-3" onclick="handleKey('ㅋ')">ㅋ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㅌ')">ㅌ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㅊ')">ㅊ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㅍ')">ㅍ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㅠ')">ㅠ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㅜ')">ㅜ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㅡ')">ㅡ</div>
                <div class="key flex-[2] py-3 bg-emerald-600 text-white font-bold" onclick="handleSubmit()">제출</div>
            </div>
        </div>
    </main>

    <!-- 대결방 모달 -->
    <div id="lobbyModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl relative animate-scale">
            <button onclick="closeLobbyModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <h2 class="text-xl font-bold mb-4 text-slate-800">친구와 함께 대결하기</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">내 닉네임</label>
                    <input type="text" id="nicknameInput" placeholder="닉네임을 입력하세요" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div class="grid grid-cols-2 gap-2 pt-2">
                    <button onclick="createRoom()" class="py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm transition shadow-sm">새 대결방 만들기</button>
                    <button onclick="showJoinInput()" class="py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm transition shadow-sm">방 참여하기</button>
                </div>
                <div id="joinCodeArea" class="hidden pt-2 border-t border-slate-100 space-y-2">
                    <input type="text" id="roomCodeInput" maxlength="6" placeholder="6자리 방 코드 입력" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm text-center tracking-widest font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button onclick="joinRoom()" class="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm transition">참여하기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 게임 종료 팝업 -->
    <div id="gameOverModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-center shadow-xl">
            <h3 id="gameOverTitle" class="text-2xl font-black mb-2 text-slate-800">게임 종료!</h3>
            <p id="gameOverDesc" class="text-slate-600 text-sm mb-6">정답을 맞췄습니다!</p>
            <button onclick="nextRound()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition shadow-sm">다음 라운드 진행</button>
        </div>
    </div>

    <!-- 알림 토스트 -->
    <div id="toast" class="fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-slate-900/90 text-white px-4 py-2 rounded-xl text-sm font-medium opacity-0 transition-opacity pointer-events-none z-50"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBZmxJUr5oaZttF7oIYJSEBb5RgjVQjInY",
            authDomain: "cofirm-board.firebaseapp.com",
            databaseURL: "https://cofirm-board-default-rtdb.firebaseio.com",
            projectId: "cofirm-board",
            storageBucket: "cofirm-board.appspot.com",
            messagingSenderId: "367825644618",
            appId: "1:367825644618:web:3f236c72c0d5347878ab3"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myUid = localStorage.getItem('wordle_uid');
        if (!myUid) {
            myUid = 'user_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('wordle_uid', myUid);
        }

        const WORDS = ["ㅊㅗㅅㅜㄴ", "ㅎㅏㄴㄱㅡ", "ㅂㅏㄷㅏㅁ", "ㅅㅏㄹㅏㅇ", "ㄱㅗㅇㅂㅜ", "ㄴㅗㅌㅡㅂ", "ㅋㅗㅍㅣㄴ"];
        let secretWord = "ㅊㅗㅅㅜㄴ";
        let currentGuess = "";
        let submittedGuesses = []; // 이미 제출된 단어들 (최대 5개)
        const maxGuesses = 5;      // 총 5회 시도
        let isGameOver = false;

        let currentRoomCode = null;
        let myNickname = "플레이어";
        let isMaster = false;
        let roomDataListener = null;

        const boardEl = document.getElementById('board');

        function initBoard() {
            boardEl.innerHTML = '';
            for (let i = 0; i < maxGuesses; i++) {
                const row = document.createElement('div');
                row.className = 'grid grid-cols-5 gap-2';
                for (let j = 0; j < 5; j++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.id = `tile-${i}-${j}`;
                    row.appendChild(tile);
                }
                boardEl.appendChild(row);
            }
        }

        function renderBoard() {
            for (let i = 0; i < maxGuesses; i++) {
                const isSubmitted = i < submittedGuesses.length;
                const guess = isSubmitted ? submittedGuesses[i] : (i === submittedGuesses.length ? currentGuess : "");

                for (let j = 0; j < 5; j++) {
                    const tile = document.getElementById(`tile-${i}-${j}`);
                    const char = guess[j] || "";
                    tile.textContent = char;
                    tile.className = 'tile';
                    if (char) tile.classList.add('filled');

                    // 이미 '제출'된 행만 채점 색상 적용
                    if (isSubmitted) {
                        const targetChars = secretWord.split('');
                        const guessChars = guess.split('');
                        if (guessChars[j] === targetChars[j]) {
                            tile.classList.add('correct');
                        } else if (targetChars.includes(guessChars[j])) {
                            tile.classList.add('present');
                        } else {
                            tile.classList.add('absent');
                        }
                    }
                }
            }
            updateKeyboardColors();
            
            // 멀티플레이 상태 전송
            if (currentRoomCode) {
                db.ref(`rooms/${currentRoomCode}/players/${myUid}`).update({
                    nickname: myNickname,
                    guesses: submittedGuesses,
                    completed: submittedGuesses.includes(secretWord) || submittedGuesses.length >= maxGuesses
                });
            }
        }

        function updateKeyboardColors() {
            const keyElements = document.querySelectorAll('.key');
            keyElements.forEach(key => {
                const char = key.textContent.trim();
                if (char.length !== 1) return;
                
                let status = 0; // 0: normal, 1: absent, 2: present, 3: correct
                submittedGuesses.forEach(guess => {
                    for (let j = 0; j < 5; j++) {
                        if (guess[j] === char) {
                            if (secretWord[j] === char) status = Math.max(status, 3);
                            else if (secretWord.includes(char)) status = Math.max(status, 2);
                            else status = Math.max(status, 1);
                        }
                    }
                });

                key.className = 'key flex-1 py-3';
                if (status === 3) key.classList.add('correct');
                else if (status === 2) key.classList.add('present');
                else if (status === 1) key.classList.add('absent');
            });
        }

        function handleKey(char) {
            if (isGameOver) return;
            if (submittedGuesses.length >= maxGuesses) return;
            if (currentGuess.length < 5) {
                currentGuess += char;
                renderBoard();
            }
        }

        function handleDelete() {
            if (isGameOver) return;
            if (currentGuess.length > 0) {
                currentGuess = currentGuess.slice(0, -1);
                renderBoard();
            }
        }

        function handleSubmit() {
            if (isGameOver) return;
            if (submittedGuesses.length >= maxGuesses) return;

            if (currentGuess.length !== 5) {
                showToast("5자모를 모두 입력한 뒤 제출해주세요!");
                return;
            }

            // 제출 진행 및 채점
            const newGuess = currentGuess;
            submittedGuesses.push(newGuess);
            currentGuess = "";
            renderBoard();

            // 판정
            if (newGuess === secretWord) {
                isGameOver = true;
                showGameOverModal("정답입니다! 🎉", `시도 횟수: ${submittedGuesses.length} / ${maxGuesses}회`);
            } else if (submittedGuesses.length >= maxGuesses) {
                isGameOver = true;
                showGameOverModal("게임 오버 😢", `정답은 [ ${secretWord} ] 입니다.`);
            } else {
                showToast(`${submittedGuesses.length}번째 시도 완료! 다음 단어를 입력하세요.`);
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2000);
        }

        // --- 멀티플레이 로직 ---
        function openLobbyModal() {
            document.getElementById('lobbyModal').classList.remove('hidden');
        }
        function closeLobbyModal() {
            document.getElementById('lobbyModal').classList.add('hidden');
        }
        function showJoinInput() {
            document.getElementById('joinCodeArea').classList.remove('hidden');
        }

        function createRoom() {
            const nick = document.getElementById('nicknameInput').value.trim();
            if (!nick) { alert("닉네임을 입력해주세요!"); return; }
            myNickname = nick;

            const roomCode = Math.floor(100000 + Math.random() * 900000).toString();
            currentRoomCode = roomCode;
            isMaster = true;

            const initialWord = WORDS[Math.floor(Math.random() * WORDS.length)];

            db.ref(`rooms/${roomCode}`).set({
                secretWord: initialWord,
                masterUid: myUid,
                masterName: myNickname,
                round: 1,
                players: {
                    [myUid]: { nickname: myNickname, guesses: [], completed: false }
                }
            }).then(() => {
                closeLobbyModal();
                enterRoomMode(roomCode, initialWord, true);
                showToast("대결 방이 생성되었습니다!");
            });
        }

        function joinRoom() {
            const nick = document.getElementById('nicknameInput').value.trim();
            const roomCode = document.getElementById('roomCodeInput').value.trim();
            if (!nick) { alert("닉네임을 입력해주세요!"); return; }
            if (roomCode.length !== 6) { alert("올바른 6자리 방 코드를 입력해주세요!"); return; }
            myNickname = nick;
            currentRoomCode = roomCode;

            db.ref(`rooms/${roomCode}`).once('value', snapshot => {
                const room = snapshot.val();
                if (!room) { alert("존재하지 않는 방입니다."); return; }

                isMaster = (room.masterUid === myUid);
                db.ref(`rooms/${roomCode}/players/${myUid}`).set({
                    nickname: myNickname, guesses: [], completed: false
                });

                closeLobbyModal();
                enterRoomMode(roomCode, room.secretWord, isMaster);
                showToast("방에 입장했습니다!");
            });
        }

        function enterRoomMode(roomCode, word, masterStatus) {
            secretWord = word;
            isMaster = masterStatus;
            document.getElementById('gameModeBadge').textContent = "대결 모드";
            document.getElementById('multiplayerInfo').classList.remove('hidden');
            document.getElementById('dispRoomCode').textContent = roomCode;
            
            if (isMaster) {
                document.getElementById('wordSetterBox').classList.remove('hidden');
                document.getElementById('spectatorDashboard').classList.remove('hidden');
                document.getElementById('masterNotice').classList.remove('hidden');
                document.getElementById('dispMaster').textContent = `${myNickname} (나)`;
            } else {
                document.getElementById('wordSetterBox').classList.add('hidden');
                document.getElementById('spectatorDashboard').classList.add('hidden');
                document.getElementById('masterNotice').classList.add('hidden');
            }

            if (roomDataListener) db.ref(`rooms/${currentRoomCode}`).off('value', roomDataListener);
            roomDataListener = db.ref(`rooms/${currentRoomCode}`).on('value', snapshot => {
                const data = snapshot.val();
                if (!data) return;
                secretWord = data.secretWord;
                isMaster = (data.masterUid === myUid);
                document.getElementById('dispMaster').textContent = data.masterName || "알 수 없음";

                if (isMaster) {
                    document.getElementById('wordSetterBox').classList.remove('hidden');
                    document.getElementById('spectatorDashboard').classList.remove('hidden');
                    document.getElementById('masterNotice').classList.remove('hidden');
                } else {
                    document.getElementById('wordSetterBox').classList.add('hidden');
                    document.getElementById('spectatorDashboard').classList.add('hidden');
                    document.getElementById('masterNotice').classList.add('hidden');
                }

                if (isMaster && data.players) {
                    updateSpectatorBoard(data.players);
                }
            });

            resetGameData();
        }

        function setSecretWord() {
            const val = document.getElementById('customWordInput').value.trim();
            if (val.length !== 5) { alert("5자모 단어를 정확히 입력해주세요!"); return; }
            db.ref(`rooms/${currentRoomCode}`).update({ secretWord: val });
            showToast("정답 단어가 설정되었습니다!");
            document.getElementById('customWordInput').value = "";
        }

        function updateSpectatorBoard(players) {
            const listEl = document.getElementById('playerStatusList');
            listEl.innerHTML = '';
            for (const [uid, p] of Object.entries(players)) {
                if (uid === myUid) continue;
                const div = document.createElement('div');
                div.className = 'bg-white p-2 rounded-lg border border-slate-100 flex items-center justify-between text-xs';
                
                let miniGridHtml = '<div class="flex space-x-1">';
                const pGuesses = p.guesses || [];
                for (let i = 0; i < maxGuesses; i++) {
                    const g = pGuesses[i] || "";
                    let colorClass = 'bg-slate-100 border border-slate-200';
                    if (g) {
                        if (g === secretWord) colorClass = 'bg-emerald-400';
                        else colorClass = 'bg-amber-400';
                    }
                    miniGridHtml += `<div class="w-4 h-4 rounded ${colorClass}"></div>`;
                }
                miniGridHtml += '</div>';

                div.innerHTML = `<span class="font-bold text-slate-700">${p.nickname}</span> ${miniGridHtml}`;
                listEl.appendChild(div);
            }
        }

        function showGameOverModal(title, desc) {
            document.getElementById('gameOverTitle').textContent = title;
            document.getElementById('gameOverDesc').textContent = desc;
            document.getElementById('gameOverModal').classList.remove('hidden');
        }

        function nextRound() {
            document.getElementById('gameOverModal').classList.add('hidden');
            if (currentRoomCode) {
                db.ref(`rooms/${currentRoomCode}`).once('value', snapshot => {
                    const data = snapshot.val();
                    const players = Object.keys(data.players || {});
                    const currentIndex = players.indexOf(data.masterUid);
                    const nextMasterUid = players[(currentIndex + 1) % players.length];
                    const nextMasterName = data.players[nextMasterUid].nickname;

                    const newWord = WORDS[Math.floor(Math.random() * WORDS.length)];
                    db.ref(`rooms/${currentRoomCode}`).update({
                        secretWord: newWord,
                        masterUid: nextMasterUid,
                        masterName: nextMasterName,
                        round: (data.round || 1) + 1
                    });
                    resetGameData();
                });
            } else {
                resetGameData();
            }
        }

        function resetGameData() {
            currentGuess = "";
            submittedGuesses = [];
            isGameOver = false;
            initBoard();
            renderBoard();
        }

        // 초기화 실행
        initBoard();
    </script>
</body>
</html>
