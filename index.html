<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>오늘의 단어 - 대결 모드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK (Compat 버전) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <!-- Hangul.js (한글 자모 조합 검증용) -->
    <script src="https://unpkg.com/hangul-js@0.2.6/hangul.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; user-select: none; }
        .tile {
            width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.25rem; font-weight: 700; border-radius: 0.5rem;
            border: 2px solid #e2e8f0; background-color: #ffffff; color: #1e293b;
            transition: all 0.15s ease-in-out;
        }
        @media (min-width: 400px) {
            .tile { width: 50px; height: 50px; font-size: 1.4rem; }
        }
        .tile.correct { background-color: #4ade80 !important; border-color: #4ade80 !important; color: white !important; }
        .tile.present { background-color: #facc15 !important; border-color: #facc15 !important; color: white !important; }
        .tile.absent { background-color: #94a3b8 !important; border-color: #94a3b8 !important; color: white !important; }
        .tile.filled { border-color: #64748b; transform: scale(1.03); }
        .tile.maker-input { border-color: #f59e0b; background-color: #fef3c7; color: #78350f; }

        .key {
            background-color: #e2e8f0; color: #334155; font-weight: 600;
            border-radius: 0.5rem; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: background-color 0.1s; font-size: 0.95rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .key:active { background-color: #cbd5e1; transform: scale(0.95); }
        .key.correct { background-color: #4ade80 !important; color: white !important; }
        .key.present { background-color: #facc15 !important; color: white !important; }
        .key.absent { background-color: #94a3b8 !important; color: white !important; }
        
        .length-btn.active {
            background-color: #059669 !important;
            color: #ffffff !important;
            font-weight: 700;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen text-slate-800">

    <!-- 상단 헤더 -->
    <header class="flex items-center justify-between px-4 py-3 bg-white border-b border-slate-200 shadow-sm">
        <div class="flex items-center space-x-2">
            <span class="px-2 py-1 bg-emerald-500 text-white font-black rounded text-lg tracking-wider">단</span>
            <h1 class="text-xl font-bold tracking-tight">오늘의 단어</h1>
            <span id="gameModeBadge" class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-medium">혼자 하기</span>
        </div>
        <div class="flex items-center space-x-2">
            <!-- 글자 수 선택 버튼 -->
            <div id="wordLengthSelector" class="flex bg-slate-100 p-0.5 rounded-lg text-xs font-semibold text-slate-600">
                <button onclick="setWordLength(5)" id="lenBtn-5" class="length-btn px-2 py-1 rounded-md transition active">5자</button>
                <button onclick="setWordLength(6)" id="lenBtn-6" class="length-btn px-2 py-1 rounded-md transition">6자</button>
                <button onclick="setWordLength(7)" id="lenBtn-7" class="length-btn px-2 py-1 rounded-md transition">7자</button>
            </div>
            <button onclick="openLobbyModal()" class="flex items-center space-x-1 px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-semibold transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                <span id="roomBtnText">대결 방</span>
            </button>
        </div>
    </header>

    <!-- 메인 게임 영역 -->
    <main class="flex-1 flex flex-col items-center justify-between max-w-md w-full mx-auto p-4">
        
        <!-- 대결 정보 바 -->
        <div id="multiplayerInfo" class="w-full bg-emerald-50 border border-emerald-200 rounded-xl p-3 mb-2 hidden">
            <div class="flex justify-between items-center text-sm">
                <div>방코드: <span id="dispRoomCode" class="font-bold text-emerald-700"></span></div>
                <div>출제자: <span id="dispMaster" class="font-bold text-emerald-700"></span></div>
            </div>
            <div id="masterNotice" class="text-xs text-amber-700 mt-1 font-medium hidden">🎯 첫 번째 줄 타일에 자모를 입력하고 [문제 출제] 버튼을 누르세요!</div>
            <div id="dispHostRow" class="hidden text-sm mt-1">방장: <span id="dispHost" class="font-bold text-amber-600"></span></div>
            <div id="roomActions" class="hidden mt-2">
                <div class="flex flex-wrap gap-2">
                    <button id="hostBtn" onclick="openHostModal()" class="hidden px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold rounded-lg transition">👑 방 관리</button>
                    <button id="hintReqBtn" onclick="requestHint()" class="hidden px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-lg transition">💡 힌트 요청</button>
                </div>
            </div>
            <div id="hintBanner" onclick="reopenHintModal()" class="hidden mt-2 text-xs font-semibold text-indigo-700 bg-indigo-50 border border-indigo-100 rounded-lg px-2.5 py-1.5 cursor-pointer"></div>
            <div id="hintBar" class="hidden mt-2 flex items-center gap-1 flex-wrap"></div>
        </div>

        <!-- 메인 게임 보드 -->
        <div id="board" class="grid gap-2 my-auto"></div>

        <!-- 실시간 관전 대시보드 -->
        <div id="spectatorDashboard" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 mb-3 hidden max-h-48 overflow-y-auto">
            <p id="spectatorTitle" class="text-xs font-bold text-slate-700 mb-2">👁️ 실시간 참가자 현황 관전 보드</p>
            <div id="spectatorChips" class="flex-wrap gap-1 mb-2" style="display:none"></div>
            <div id="playerStatusList" class="space-y-2"></div>
        </div>

        <!-- 키보드 영역 -->
        <div id="keyboard" class="w-full space-y-1.5 pb-2">
            <div class="flex justify-center space-x-1.5">
                <div class="key flex-1 py-3" onclick="handleKey('ㅂ')">ㅂ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㅈ')">ㅈ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㄷ')">ㄷ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㄱ')">ㄱ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㅅ')">ㅅ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㅛ')">ㅛ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㅕ')">ㅕ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㅑ')">ㅑ</div>
                <div class="key flex-1 py-3 bg-slate-300" onclick="handleDelete()"><svg class="w-5 h-5 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-8.172a2 2 0 00-1.414.586L3 12z"></path></svg></div>
            </div>
            <div class="flex justify-center space-x-1.5 px-2">
                <div class="key flex-1 py-3" onclick="handleKey('ㅁ')">ㅁ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㄴ')">ㄴ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㅇ')">ㅇ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㄹ')">ㄹ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㅎ')">ㅎ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㅗ')">ㅗ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㅓ')">ㅓ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㅏ')">ㅏ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㅣ')">ㅣ</div>
            </div>
            <div class="flex justify-center space-x-1.5">
                <div class="key flex-1 py-3" onclick="handleKey('ㅋ')">ㅋ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㅌ')">ㅌ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㅊ')">ㅊ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㅍ')">ㅍ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㅠ')">ㅠ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㅜ')">ㅜ</div>
                <div class="key flex-1 py-3" onclick="handleKey('ㅡ')">ㅡ</div>
                <div id="submitBtn" class="key flex-[2] py-3 bg-emerald-600 text-white font-bold" onclick="handleSubmit()">제출</div>
            </div>
        </div>
    </main>

    <!-- 대결방 모달 -->
    <div id="lobbyModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl relative animate-scale">
            <button onclick="closeLobbyModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <h2 class="text-xl font-bold mb-4 text-slate-800">친구와 함께 대결하기</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">내 닉네임</label>
                    <input type="text" id="nicknameInput" placeholder="닉네임을 입력하세요" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div class="grid grid-cols-2 gap-2 pt-2">
                    <button onclick="createRoom()" class="py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm transition shadow-sm">새 대결방 만들기</button>
                    <button onclick="showJoinInput()" class="py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm transition shadow-sm">방 참여하기</button>
                </div>
                <div id="joinCodeArea" class="hidden pt-2 border-t border-slate-100 space-y-2">
                    <input type="text" id="roomCodeInput" maxlength="6" placeholder="6자리 방 코드 입력" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm text-center tracking-widest font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button onclick="joinRoom(false)" class="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm transition">참여하기 (문제 풀기)</button>
                    <button onclick="joinRoom(true)" class="w-full py-2 bg-slate-600 hover:bg-slate-700 text-white font-bold rounded-xl text-sm transition">👀 관전만 하기 (문제 안 풀어요)</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 라운드 결과지 모달 -->
    <div id="gameOverModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-center shadow-xl">
            <h3 id="gameOverTitle" class="text-2xl font-black mb-2 text-slate-800">라운드 결과</h3>
            <div id="gameOverDesc" class="text-slate-600 text-sm mb-6"></div>
            <div id="gameOverActionContainer"></div>
        </div>
    </div>

    <!-- 방 관리 모달 (방장 전용) -->
    <div id="hostModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-xl max-h-[80vh] flex flex-col">
            <div class="flex items-center justify-between mb-2">
                <h3 class="text-lg font-black text-slate-800">👑 방 관리</h3>
                <button onclick="closeHostModal()" class="text-slate-400 hover:text-slate-600 text-sm font-semibold">닫기</button>
            </div>
            <p class="text-[11px] text-slate-500 mb-3">출제자를 바꾸면 이번 라운드가 처음부터 다시 시작돼요. 강퇴하면 그 사람은 방에서 나가게 되고, 방 코드를 입력하면 다시 들어올 수 있어요.</p>
            <div id="hostPlayerList" class="space-y-2 overflow-y-auto"></div>
        </div>
    </div>

    <!-- 힌트 투표 모달 -->
    <div id="hintModal" class="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-xl">
            <div class="flex items-start justify-between">
                <h3 class="text-lg font-black text-slate-800">💡 힌트 투표</h3>
                <button onclick="dismissHintModal()" class="text-slate-400 hover:text-slate-600 text-sm font-semibold">닫기</button>
            </div>
            <p id="hintModalDesc" class="text-xs text-slate-500 mt-1 mb-3"></p>
            <div id="hintVoteControls"></div>
            <p id="hintModalStatus" class="text-[11px] text-slate-500 mt-3 text-center"></p>
        </div>
    </div>

    <!-- 알림 토스트 -->
    <div id="toast" class="fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-slate-900/90 text-white px-4 py-2 rounded-xl text-sm font-medium opacity-0 transition-opacity pointer-events-none z-50"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBZmxJUr5oaZttF7oIYJSEBb5RgjVQjInY",
            authDomain: "cofirm-board.firebaseapp.com",
            databaseURL: "https://cofirm-board-default-rtdb.firebaseio.com",
            projectId: "cofirm-board",
            storageBucket: "cofirm-board.appspot.com",
            messagingSenderId: "367825644618",
            appId: "1:367825644618:web:3f236c72c0d5347878ab3"
        };
        // Firebase 로드/초기화가 실패해도 입력 기능 전체가 멈추지 않도록 보호
        let db = null;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        } catch (e) {
            console.error('Firebase 초기화 실패:', e);
        }

        // localStorage가 막힌 환경(인앱 브라우저, iframe 등)에서도 동작하도록 보호
        let myUid = null;
        try { myUid = localStorage.getItem('wordle_uid'); } catch (e) {}
        if (!myUid) {
            myUid = 'user_' + Math.random().toString(36).substr(2, 9);
            try { localStorage.setItem('wordle_uid', myUid); } catch (e) {}
        }

        let wordLength = 5;
        let secretWord = "";
        let currentGuess = "";
        let submittedGuesses = [];
        const maxGuesses = 5;
        let isGameOver = false;
        let isResultsShown = false;
        let solvedTimestamp = null;

        // 키보드 자판 상태 { 자모: 3(correct) | 2(present) | 1(absent) }
        let keyboardState = {};

        // 출제자 전용 상태
        let makerWord = "";
        let hasMasterSetWord = false;

        let currentRoomCode = null;
        let myNickname = "플레이어";
        let isMaster = false;
        let isSpectator = false;   // 관전 전용 입장 여부 (문제를 풀지 않고 출제자처럼 관전 보드만 봄)
        let roomDataListener = null;

        // 방장(👑) / 힌트 투표 상태
        let hostUid = null;          // 방을 처음 만든 사람 (강퇴, 출제자 변경 권한)
        let isHost = false;
        let lastRoomData = null;     // 최신 방 데이터 (방 관리/힌트 UI에서 사용)
        const MAX_HINTS_PER_ROUND = 2;      // 한 라운드에 공개할 수 있는 힌트 수
        const HINT_VOTE_SECONDS = 30;       // 투표 제한 시간
        const HINT_COOLDOWN_SECONDS = 15;   // 힌트 투표가 끝난 뒤 다음 요청까지 대기 시간
        let hintTimer = null;
        let hintInitDone = false;
        let lastAnnouncedHintId = null;
        let hintModalDismissedId = null;
        let hintRenderSig = '';
        let hintBannerTimer = null;

        // 서버 시간 보정 (기기마다 시계가 달라도 투표 마감 시간이 같도록)
        let serverOffset = 0;
        if (db) {
            try { db.ref('.info/serverTimeOffset').on('value', snap => { serverOffset = snap.val() || 0; }); } catch (e) {}
        }
        const serverNow = () => Date.now() + serverOffset;
        const crown = (uid) => (uid && uid === hostUid) ? '👑 ' : '';

        const boardEl = document.getElementById('board');

        // 자모 조합 검증 함수 (한글 단어로 올바르게 구성되는지 검사)
        // ※ 입력(handleKey) 중에는 절대 호출하지 않고, "제출/출제" 버튼에서만 호출합니다.
        function isValidJamoSequence(jamoStr) {
            if (!jamoStr || jamoStr.length === 0) return true;
            if (typeof Hangul === 'undefined') return true;

            return assembleCandidates(jamoStr).some(w => Hangul.isCompleteAll(w));
        }

        // 키보드에 ㅐ/ㅔ/ㅒ/ㅖ 키가 없으므로 ㅏ+ㅣ, ㅓ+ㅣ, ㅑ+ㅣ, ㅕ+ㅣ 로 입력한 것을
        // 검증 전에 하나의 모음으로 합칩니다. (Hangul.js는 이 조합을 자동으로 합치지 못함)
        // 예) ㅁㅓㅣ → ㅁㅔ → '메',  ㅇㅗㅏㅣ → ㅇㅗㅐ → '왜'
        function normalizeJamo(jamoStr) {
            return jamoStr
                .replace(/ㅏㅣ/g, 'ㅐ')
                .replace(/ㅑㅣ/g, 'ㅒ')
                .replace(/ㅓㅣ/g, 'ㅔ')
                .replace(/ㅕㅣ/g, 'ㅖ');
        }

        // 키보드에 ㄲ/ㄸ/ㅃ/ㅆ/ㅉ 키가 없으므로 ㄱㄱ, ㄷㄷ, ㅂㅂ, ㅅㅅ, ㅈㅈ 으로 입력합니다.
        // 그런데 'ㅅㅅ'은 "쌍시옷(ㅆ)"일 수도, "받침 ㅅ + 다음 글자 초성 ㅅ"일 수도 있습니다.
        //   예) ㅇㅏㅂㅂㅏ → 아빠(ㅃ) / 압바(ㅂ+ㅂ),  ㄱㅏㅅㅅ → 갔(ㅆ 받침)
        // 그래서 가능한 해석을 모두 만들어 두고, 하나라도 맞으면 통과시킵니다.
        const DOUBLE_JAMO = { 'ㄱ': 'ㄲ', 'ㄷ': 'ㄸ', 'ㅂ': 'ㅃ', 'ㅅ': 'ㅆ', 'ㅈ': 'ㅉ' };

        function jamoVariants(str) {
            const results = [];
            (function rec(i, acc) {
                if (i >= str.length) { results.push(acc); return; }
                const c = str[i];
                if (DOUBLE_JAMO[c] && str[i + 1] === c) rec(i + 2, acc + DOUBLE_JAMO[c]); // 쌍자음으로 합침
                rec(i + 1, acc + c);                                                     // 합치지 않음
            })(0, '');
            return results;
        }

        // 입력한 자모를 글자로 조합한 가능한 결과들 (중복 제거)
        function assembleCandidates(jamoStr) {
            const set = new Set();
            jamoVariants(jamoStr).forEach(v => {
                set.add(Hangul.assemble(normalizeJamo(v).split('')));
            });
            return [...set];
        }

        // ─────────────────────────────────────────────────────────────
        // 사전 단어 확인
        //  - 표준국어대사전 기반 단어(5~7자모) 약 10만 개가 파일 맨 아래 DICT_TEXT에 들어 있습니다.
        //  - 사전에 없지만 허용하고 싶은 단어(신조어, 외래어 등)는 아래 EXTRA_WORDS에 추가하세요.
        // ─────────────────────────────────────────────────────────────
        const EXTRA_WORDS = ['메일', '카톡', '유튜브', '아이폰', '인스타', '틱톡'];

        // 입력한 자모가 사전에 있는 단어인지 확인 (제출할 때만 호출)
        function isDictionaryWord(jamoStr) {
            if (typeof Hangul === 'undefined' || typeof dictSet === 'undefined') return true; // 로드 실패 시 막지 않음
            return assembleCandidates(jamoStr).some(w => dictSet.has(w));
        }

        // 자모를 글자로 조합한 결과 (오류 안내용)
        function assemblePreview(jamoStr) {
            if (typeof Hangul === 'undefined') return '';
            const cands = assembleCandidates(jamoStr);
            return cands.find(w => Hangul.isCompleteAll(w)) || cands[0] || '';
        }

        function setWordLength(len) {
            if (isSpectator) { showToast("관전 중에는 글자 수를 바꿀 수 없어요."); return; }
            if (submittedGuesses.length > 0 || (isMaster && makerWord.length > 0)) {
                if (!confirm("글자 수를 변경하면 진행 중인 입력이 초기화됩니다. 변경하시겠습니까?")) return;
            }
            wordLength = len;
            
            setWordLengthUI(wordLength);

            if (currentRoomCode && isMaster) {
                db.ref(`rooms/${currentRoomCode}`).update({ targetLength: wordLength });
            }

            resetGameData();
        }

        function initBoard() {
            boardEl.innerHTML = '';
            boardEl.className = `grid grid-rows-5 gap-2 my-auto`;
            
            for (let i = 0; i < maxGuesses; i++) {
                const row = document.createElement('div');
                row.className = `grid gap-2`;
                row.style.gridTemplateColumns = `repeat(${wordLength}, minmax(0, 1fr))`;
                for (let j = 0; j < wordLength; j++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.id = `tile-${i}-${j}`;
                    row.appendChild(tile);
                }
                boardEl.appendChild(row);
            }
        }

        function evaluateGuess(guess, target) {
            const res = new Array(guess.length).fill('absent');
            if (!target || target.length !== guess.length) return res;

            const targetChars = target.split('');
            const guessChars = guess.split('');
            const targetCounts = {};

            for (let i = 0; i < targetChars.length; i++) {
                const char = targetChars[i];
                if (guessChars[i] === char) {
                    res[i] = 'correct';
                } else {
                    targetCounts[char] = (targetCounts[char] || 0) + 1;
                }
            }

            for (let i = 0; i < guessChars.length; i++) {
                if (res[i] === 'correct') continue;
                const char = guessChars[i];
                if (targetCounts[char] && targetCounts[char] > 0) {
                    res[i] = 'present';
                    targetCounts[char]--;
                }
            }

            return res;
        }

        function renderBoard() {
            if (isMaster) {
                for (let i = 0; i < maxGuesses; i++) {
                    for (let j = 0; j < wordLength; j++) {
                        const tile = document.getElementById(`tile-${i}-${j}`);
                        if (!tile) continue;
                        tile.className = 'tile';
                        if (i === 0) {
                            const char = hasMasterSetWord ? (secretWord[j] || "") : (makerWord[j] || "");
                            tile.textContent = char;
                            tile.classList.add('maker-input');
                            if (char) tile.classList.add('filled');
                        } else {
                            tile.textContent = "";
                        }
                    }
                }
                clearKeyboardColors();   // 출제자 키보드에 남은 채점 색 제거
                return;
            }

            for (let i = 0; i < maxGuesses; i++) {
                const isSubmitted = i < submittedGuesses.length;
                const guess = isSubmitted ? submittedGuesses[i] : (i === submittedGuesses.length ? currentGuess : "");
                const evaluation = isSubmitted ? evaluateGuess(guess, secretWord) : null;

                for (let j = 0; j < wordLength; j++) {
                    const tile = document.getElementById(`tile-${i}-${j}`);
                    if (!tile) continue;
                    const char = guess[j] || "";
                    tile.textContent = char;
                    tile.className = 'tile';
                    if (char) tile.classList.add('filled');

                    if (isSubmitted && evaluation) {
                        tile.classList.add(evaluation[j]);
                    }
                }
            }
            updateKeyboardColors();
        }

        // 내 진행 상황을 서버에 저장 (제출 시 / 라운드 초기화 시에만 호출)
        function syncMyProgress() {
            if (!db || !currentRoomCode || isMaster || isSpectator) return;
            const isCompleted = (!!secretWord && submittedGuesses.includes(secretWord)) || submittedGuesses.length >= maxGuesses;
            const updateData = {
                nickname: myNickname,
                guesses: submittedGuesses,
                completed: isCompleted
            };
            if (secretWord && submittedGuesses.includes(secretWord) && !solvedTimestamp) {
                solvedTimestamp = Date.now();
                updateData.solvedTimestamp = solvedTimestamp;
            }
            db.ref(`rooms/${currentRoomCode}/players/${myUid}`).update(updateData);
        }

        // 키보드의 채점 색(초록/노랑/회색)을 모두 지움
        function clearKeyboardColors() {
            document.querySelectorAll('.key').forEach(key => {
                const char = key.textContent.trim();
                if (char.length !== 1) return;   // 삭제/제출 키는 건드리지 않음
                key.className = 'key flex-1 py-3';
            });
        }

        function updateKeyboardColors() {
            // 출제자/관전자는 채점을 하지 않으므로, 이전 라운드에 남은 색을 지움
            if (isMaster || isSpectator) { clearKeyboardColors(); return; }

            submittedGuesses.forEach(guess => {
                const evalRes = evaluateGuess(guess, secretWord);
                for (let j = 0; j < guess.length; j++) {
                    const char = guess[j];
                    const status = evalRes[j];
                    let val = 1;
                    if (status === 'correct') val = 3;
                    else if (status === 'present') val = 2;

                    if (!keyboardState[char] || val > keyboardState[char]) {
                        keyboardState[char] = val;
                    }
                }
            });

            const keyElements = document.querySelectorAll('.key');
            keyElements.forEach(key => {
                const char = key.textContent.trim();
                if (char.length !== 1) return;
                
                const status = keyboardState[char] || 0;
                key.className = 'key flex-1 py-3';
                if (status === 3) key.classList.add('correct');
                else if (status === 2) key.classList.add('present');
                else if (status === 1) key.classList.add('absent');
            });
        }

        function handleKey(char) {
            // 입력 중에는 어떤 자모든 자유롭게 입력할 수 있습니다.
            // 글자 완성 여부는 [제출]/[문제 출제] 버튼을 누를 때(handleSubmit)만 검사합니다.
            if (isSpectator) return;
            if (!/^[ㄱ-ㅎㅏ-ㅣ]$/.test(char)) return;
            if (isMaster) {
                if (hasMasterSetWord) return;
                if (makerWord.length < wordLength) {
                    const nextMaker = makerWord + char;
                    makerWord = nextMaker;
                    renderBoard();
                }
                return;
            }

            if (isGameOver) return;
            if (submittedGuesses.length >= maxGuesses) return;
            if (currentGuess.length < wordLength) {
                const nextGuess = currentGuess + char;
                currentGuess = nextGuess;
                renderBoard();
            }
        }

        function handleDelete() {
            if (isSpectator) return;
            if (isMaster) {
                if (hasMasterSetWord) return;
                if (makerWord.length > 0) {
                    makerWord = makerWord.slice(0, -1);
                    renderBoard();
                }
                return;
            }

            if (isGameOver) return;
            if (currentGuess.length > 0) {
                currentGuess = currentGuess.slice(0, -1);
                renderBoard();
            }
        }

        function handleSubmit() {
            if (isSpectator) return;
            if (isMaster) {
                if (hasMasterSetWord) {
                    showToast("이미 출제가 완료되었습니다!");
                    return;
                }
                if (makerWord.length !== wordLength) {
                    showToast(`첫번째 줄에 ${wordLength}자모를 모두 채워주세요!`);
                    return;
                }
                if (!isValidJamoSequence(makerWord)) {
                    showToast(`완성되지 않은 글자가 있어요! (${assemblePreview(makerWord)})`);
                    return;
                }
                if (!isDictionaryWord(makerWord)) {
                    showToast(`사전에 없는 단어예요! (${assemblePreview(makerWord)})`);
                    return;
                }
                if (!db || !currentRoomCode) {
                    showToast("서버에 연결되지 않아 출제할 수 없습니다.");
                    return;
                }
                db.ref(`rooms/${currentRoomCode}`).update({ secretWord: makerWord, targetLength: wordLength, hintState: null });
                hasMasterSetWord = true;
                showToast("🎯 문제가 출제되었습니다!");
                toggleMasterUI();
                renderBoard();
                return;
            }

            if (isGameOver) return;
            if (submittedGuesses.length >= maxGuesses) return;

            if (!secretWord) {
                showToast("출제자가 아직 문제를 출제하지 않았습니다!");
                return;
            }

            if (currentGuess.length !== wordLength) {
                showToast(`${wordLength}자모를 모두 입력한 뒤 제출해주세요!`);
                return;
            }

            // 제출할 때만 완성된 글자인지 확인 (미완성이면 입력은 그대로 유지)
            if (!isValidJamoSequence(currentGuess)) {
                showToast(`완성되지 않은 글자가 있어요! (${assemblePreview(currentGuess)})`);
                return;
            }

            // 사전에 없는 단어는 제출 불가 (시도 횟수는 차감되지 않고, 힌트도 주지 않음)
            // 단, 정답과 같은 입력은 항상 허용
            if (currentGuess !== secretWord && !isDictionaryWord(currentGuess)) {
                showToast(`사전에 없는 단어예요! (${assemblePreview(currentGuess)})`);
                return;
            }

            const newGuess = currentGuess;
            submittedGuesses.push(newGuess);
            currentGuess = "";
            renderBoard();
            syncMyProgress();

            if (newGuess === secretWord || submittedGuesses.length >= maxGuesses) {
                isGameOver = true;
                updateHintButton();
                if (newGuess === secretWord) {
                    showToast("정답을 맞췄습니다! 다른 참가자들을 기다리는 중...");
                } else {
                    showToast("모든 기회를 소모했습니다. 다른 참가자들을 기다리는 중...");
                }
            } else {
                showToast(`${submittedGuesses.length}번째 시도 완료! 다음 단어를 입력하세요.`);
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2000);
        }

        function openLobbyModal() {
            document.getElementById('lobbyModal').classList.remove('hidden');
        }
        function closeLobbyModal() {
            document.getElementById('lobbyModal').classList.add('hidden');
        }
        function showJoinInput() {
            document.getElementById('joinCodeArea').classList.remove('hidden');
        }

        function createRoom() {
            const nick = document.getElementById('nicknameInput').value.trim();
            if (!nick) { alert("닉네임을 입력해주세요!"); return; }
            if (!db) { alert("서버(Firebase)에 연결할 수 없습니다. 인터넷 연결을 확인해주세요."); return; }
            myNickname = nick;

            const roomCode = Math.floor(100000 + Math.random() * 900000).toString();
            currentRoomCode = roomCode;
            isMaster = true;
            isSpectator = false;

            db.ref(`rooms/${roomCode}`).set({
                secretWord: "",
                targetLength: wordLength,
                masterUid: myUid,
                masterName: myNickname,
                hostUid: myUid,          // 방을 만든 사람 = 방장 👑
                hostName: myNickname,
                round: 1,
                players: {
                    [myUid]: { nickname: myNickname, guesses: [], completed: true, solvedTimestamp: 0 }
                }
            }).then(() => {
                closeLobbyModal();
                enterRoomMode(roomCode, "", true);
                showToast("대결 방이 생성되었습니다!");
            });
        }

        function joinRoom(asSpectator = false) {
            const nick = document.getElementById('nicknameInput').value.trim();
            const roomCode = document.getElementById('roomCodeInput').value.trim();
            if (!nick) { alert("닉네임을 입력해주세요!"); return; }
            if (roomCode.length !== 6) { alert("올바른 6자리 방 코드를 입력해주세요!"); return; }
            if (!db) { alert("서버(Firebase)에 연결할 수 없습니다. 인터넷 연결을 확인해주세요."); return; }
            db.ref(`rooms/${roomCode}`).once('value', snapshot => {
                const room = snapshot.val();
                if (!room) { alert("존재하지 않는 방입니다."); return; }
                const joiningAsMaster = (room.masterUid === myUid);
                if (asSpectator && joiningAsMaster) {
                    alert("현재 출제자는 관전 전용으로 입장할 수 없어요. [참여하기]로 입장해주세요.");
                    return;
                }
                // 모든 확인이 끝난 뒤에만 내 상태를 바꿈 (실패 시 혼자 하기 모드가 망가지지 않도록)
                myNickname = nick;
                currentRoomCode = roomCode;
                isMaster = joiningAsMaster;
                isSpectator = asSpectator;
                if (room.targetLength) {
                    wordLength = room.targetLength;
                    setWordLengthUI(wordLength);
                }
                // 관전자는 spectator:true 로 표시하고, 라운드 종료 판정에 영향을 주지 않도록 completed:true 로 둡니다.
                // 이전에 방에서 내보내졌더라도 다시 입장할 수 있도록, 내 강퇴 표시를 함께 지움
                db.ref(`rooms/${roomCode}`).update({
                    [`players/${myUid}`]: {
                        nickname: myNickname, guesses: [], completed: (isMaster || isSpectator), solvedTimestamp: 0,
                        spectator: isSpectator
                    },
                    [`kicked/${myUid}`]: null
                });

                closeLobbyModal();
                enterRoomMode(roomCode, room.secretWord || "", isMaster);
                showToast(isSpectator ? "관전 모드로 입장했습니다!" : "방에 입장했습니다!");
            });
        }

        function setWordLengthUI(len) {
            [5, 6, 7].forEach(l => {
                const btn = document.getElementById(`lenBtn-${l}`);
                if (l === len) btn.classList.add('active');
                else btn.classList.remove('active');
            });
        }

        function enterRoomMode(roomCode, word, masterStatus) {
            secretWord = word;
            isMaster = masterStatus;
            lastRoomData = null; hostUid = null; isHost = false;
            hintInitDone = false; lastAnnouncedHintId = null; hintModalDismissedId = null; hintRenderSig = '';
            document.getElementById('gameModeBadge').textContent = isSpectator ? "관전 모드" : "대결 모드";
            document.getElementById('multiplayerInfo').classList.remove('hidden');
            document.getElementById('dispRoomCode').textContent = roomCode;
            
            toggleMasterUI();

            if (roomDataListener) db.ref(`rooms/${currentRoomCode}`).off('value', roomDataListener);
            roomDataListener = db.ref(`rooms/${currentRoomCode}`).on('value', snapshot => {
                const data = snapshot.val();
                if (!data) return;

                lastRoomData = data;
                if (data.kicked && data.kicked[myUid]) { handleKicked(); return; }   // 방장에게 강퇴됨
                hostUid = data.hostUid || null;
                isHost = !!hostUid && hostUid === myUid;
                
                if (data.targetLength && data.targetLength !== wordLength) {
                    wordLength = data.targetLength;
                    setWordLengthUI(wordLength);
                    resetGameData();
                }

                const newWord = data.secretWord || "";
                const newIsMaster = (data.masterUid === myUid);
                const wordChanged = (secretWord !== newWord);
                const masterChanged = (newIsMaster !== isMaster);

                if (wordChanged) {
                    secretWord = newWord;
                    if (secretWord) hasMasterSetWord = true;
                }
                // 역할(출제자/참가자)을 먼저 확정한 뒤에 초기화해야 이전 상태가 남지 않음
                isMaster = newIsMaster;

                const newRoundStarted = wordChanged && !secretWord;   // 다음 라운드 시작
                if (masterChanged || newRoundStarted || (wordChanged && !isMaster)) {
                    resetGameData();
                }

                document.getElementById('dispMaster').textContent = data.masterName || "알 수 없음";

                toggleMasterUI();
                updateRoomChrome(data);   // 방장 표시, 방 관리/힌트 버튼, 힌트 투표 UI

                if (data.players) {
                    updateSpectatorBoard(data.players, data.masterUid);

                    if (data.secretWord && !isResultsShown) {
                        const participants = Object.entries(data.players).filter(([uid, p]) => uid !== data.masterUid && !p.spectator);
                        if (participants.length > 0) {
                            const allCompleted = participants.every(([uid, p]) => p.completed);
                            if (allCompleted) {
                                isResultsShown = true;
                                showResultsModal(data);
                            }
                        }
                    }
                }
            });

            resetGameData();
        }

        function toggleMasterUI() {
            const submitBtn = document.getElementById('submitBtn');
            const noticeEl = document.getElementById('masterNotice');
            const dashEl = document.getElementById('spectatorDashboard');
            dashEl.classList.remove('hidden');

            // 관전 전용: 입력 보드/키보드를 숨기고 관전 보드를 크게 보여줌
            document.getElementById('board').classList.toggle('hidden', isSpectator);
            document.getElementById('keyboard').classList.toggle('hidden', isSpectator);
            dashEl.classList.toggle('max-h-48', !isSpectator);
            dashEl.classList.toggle('flex-1', isSpectator);
            dashEl.classList.toggle('mt-2', isSpectator);

            if (isSpectator) {
                noticeEl.classList.remove('hidden');
                noticeEl.textContent = "👀 관전 중이에요. 문제는 풀지 않고, 참가자들의 풀이를 실시간으로 볼 수 있어요.";
                return;
            }

            if (isMaster) {
                noticeEl.classList.remove('hidden');
                submitBtn.textContent = hasMasterSetWord ? "출제완료" : "문제 출제";
                submitBtn.className = hasMasterSetWord 
                    ? "key flex-[2] py-3 bg-slate-400 text-white font-bold pointer-events-none" 
                    : "key flex-[2] py-3 bg-amber-600 text-white font-bold";

                if (hasMasterSetWord) {
                    noticeEl.textContent = "🎯 정답 출제 완료! 참가자들의 풀이를 기다리는 중...";
                } else {
                    noticeEl.textContent = `🎯 첫 번째 줄 타일에 ${wordLength}자모를 입력하고 [문제 출제] 버튼을 누르세요!`;
                }
            } else {
                noticeEl.classList.add('hidden');
                submitBtn.textContent = "제출";
                submitBtn.className = "key flex-[2] py-3 bg-emerald-600 text-white font-bold";
            }
        }

        // 닉네임 등 사용자 입력값을 화면에 넣기 전에 이스케이프 (HTML 삽입 방지)
        function escapeHtml(str) {
            return String(str == null ? '' : str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // 관전 중인 사람 표시 (출제자/참가자/관전자 모두에게 보임)
        function renderSpectatorChips(players) {
            const chipsEl = document.getElementById('spectatorChips');
            const spectators = Object.entries(players).filter(([uid, p]) => p.spectator);
            if (spectators.length === 0) {
                chipsEl.innerHTML = '';
                chipsEl.style.display = 'none';
                return;
            }
            chipsEl.innerHTML = spectators.map(([uid, p]) => {
                const me = (uid === myUid) ? ' <span class="text-slate-400">(나)</span>' : '';
                return `<span class="inline-flex items-center px-2 py-0.5 rounded-full bg-slate-200 text-slate-700 text-[11px] font-semibold">👀 ${crown(uid)}${escapeHtml(p.nickname)}${me}<span class="ml-1 text-slate-500 font-normal">관전 중</span></span>`;
            }).join('');
            chipsEl.style.display = 'flex';
        }

        function updateSpectatorBoard(players, masterUid) {
            const listEl = document.getElementById('playerStatusList');
            const titleEl = document.getElementById('spectatorTitle');
            listEl.innerHTML = '';
            renderSpectatorChips(players);

            if (isMaster || isSpectator) {
                titleEl.textContent = isSpectator
                    ? "👁️ [관전자용] 참가자 입력 상세 관전 보드"
                    : "👁️ [출제자용] 참가자 입력 상세 관전 보드";
                for (const [uid, p] of Object.entries(players)) {
                    if (uid === myUid || p.spectator) continue;      // 나 자신, 다른 관전자는 표시하지 않음
                    if (isSpectator && uid === masterUid) continue;  // 관전자 화면에서는 출제자 줄도 제외
                    const div = document.createElement('div');
                    div.className = 'bg-white p-2.5 rounded-lg border border-slate-200 space-y-1';
                    
                    let rowsHtml = `<div class="font-bold text-xs text-slate-700 flex justify-between"><span>${crown(uid)}${escapeHtml(p.nickname)}</span> ${p.completed ? '<span class="text-emerald-600 font-semibold">풀이 완료</span>' : '<span class="text-amber-500">풀이 중...</span>'}</div>`;
                    rowsHtml += '<div class="space-y-1">';
                    
                    const pGuesses = p.guesses || [];
                    for (let i = 0; i < maxGuesses; i++) {
                        const g = pGuesses[i] || "";
                        const evalRes = evaluateGuess(g, secretWord);
                        rowsHtml += '<div class="flex space-x-1">';
                        for (let j = 0; j < wordLength; j++) {
                            const char = g[j] || "";
                            let tileColor = 'bg-slate-50 border-slate-200 text-slate-400';
                            if (char && secretWord) {
                                if (evalRes[j] === 'correct') tileColor = 'bg-emerald-400 border-emerald-400 text-white font-bold';
                                else if (evalRes[j] === 'present') tileColor = 'bg-amber-400 border-amber-400 text-white font-bold';
                                else tileColor = 'bg-slate-400 border-slate-400 text-white font-bold';
                            }
                            rowsHtml += `<div class="w-5 h-5 border rounded flex items-center justify-center text-[10px] ${tileColor}">${char}</div>`;
                        }
                        rowsHtml += '</div>';
                    }
                    rowsHtml += '</div>';
                    div.innerHTML = rowsHtml;
                    listEl.appendChild(div);
                }
            } else {
                titleEl.textContent = "👁️ 실시간 참가자 현황 관전 보드";
                for (const [uid, p] of Object.entries(players)) {
                    if (uid === myUid || p.spectator) continue;
                    const div = document.createElement('div');
                    div.className = 'bg-white p-2 rounded-lg border border-slate-100 flex items-center justify-between text-xs';
                    
                    let miniGridHtml = '<div class="flex space-x-1">';
                    const pGuesses = p.guesses || [];
                    for (let i = 0; i < maxGuesses; i++) {
                        const g = pGuesses[i] || "";
                        let colorClass = 'bg-slate-100 border border-slate-200';
                        if (g) {
                            if (g === secretWord) colorClass = 'bg-emerald-400';
                            else colorClass = 'bg-amber-400';
                        }
                        miniGridHtml += `<div class="w-4 h-4 rounded ${colorClass}"></div>`;
                    }
                    miniGridHtml += '</div>';

                    div.innerHTML = `<span class="font-bold text-slate-700">${crown(uid)}${escapeHtml(p.nickname)}</span> ${miniGridHtml}`;
                    listEl.appendChild(div);
                }
            }

            if (isSpectator && listEl.children.length === 0) {
                listEl.innerHTML = '<p class="text-xs text-slate-400 text-center py-6">아직 문제를 푸는 참가자가 없어요. 잠시만 기다려주세요!</p>';
            }
        }

        function showResultsModal(data) {
            const participantsList = Object.entries(data.players)
                .filter(([uid, p]) => uid !== data.masterUid && !p.spectator)
                .map(([uid, p]) => {
                    const solved = (p.guesses || []).includes(data.secretWord);
                    const attempts = solved ? p.guesses.length : 99;
                    const timestamp = p.solvedTimestamp || 9999999999999;
                    return { uid, nickname: p.nickname, solved, attempts, timestamp };
                });

            participantsList.sort((a, b) => {
                if (a.solved && !b.solved) return -1;
                if (!a.solved && b.solved) return 1;
                if (a.attempts !== b.attempts) {
                    return a.attempts - b.attempts;
                }
                return a.timestamp - b.timestamp;
            });

            document.getElementById('gameOverTitle').textContent = "🏆 라운드 결과지";
            const descEl = document.getElementById('gameOverDesc');
            
            let html = `<p class="text-xs text-slate-500 mb-3">정답: <span class="font-bold text-emerald-600">[ ${data.secretWord} ]</span></p>`;
            html += `<div class="space-y-2 text-left max-h-48 overflow-y-auto mb-4">`;
            
            participantsList.forEach((p, idx) => {
                const rankText = idx === 0 && p.solved ? "👑 1위" : `${idx + 1}위`;
                const statusText = p.solved ? `${p.attempts}회 만에 정답! 🎉` : `실패 😢`;
                html += `
                    <div class="flex items-center justify-between p-2.5 rounded-lg bg-slate-50 border border-slate-100 text-xs">
                        <span class="font-bold text-slate-700">${rankText} - ${crown(p.uid)}${escapeHtml(p.nickname)}</span>
                        <span class="${p.solved ? 'text-emerald-600 font-semibold' : 'text-slate-400'}">${statusText}</span>
                    </div>
                `;
            });
            html += `</div>`;
            descEl.innerHTML = html;

            const actionContainer = document.getElementById('gameOverActionContainer');
            actionContainer.innerHTML = '';

            if (isMaster || isHost) {
                const btn = document.createElement('button');
                btn.className = 'w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition shadow-sm';
                btn.textContent = isMaster ? '다음 라운드 진행' : '다음 라운드 진행 (방장)';
                btn.onclick = nextRound;
                actionContainer.appendChild(btn);
            } else {
                const notice = document.createElement('p');
                notice.className = 'text-xs text-amber-600 font-semibold py-2';
                notice.textContent = '⏳ 출제자가 다음 라운드를 진행하기를 기다리는 중입니다...';
                actionContainer.appendChild(notice);

                if (isSpectator) {
                    const closeBtn = document.createElement('button');
                    closeBtn.className = 'w-full mt-2 py-2.5 bg-slate-600 hover:bg-slate-700 text-white font-bold rounded-xl transition shadow-sm';
                    closeBtn.textContent = '닫고 관전 보드 보기';
                    closeBtn.onclick = () => document.getElementById('gameOverModal').classList.add('hidden');
                    actionContainer.appendChild(closeBtn);
                }
            }

            document.getElementById('gameOverModal').classList.remove('hidden');
        }

        // 새 라운드 시작: 출제자를 지정하고 모든 참가자의 기록/힌트를 초기화 (한 번의 원자적 업데이트)
        function startRound(data, nextMasterUid, incrementRound) {
            if (!db || !currentRoomCode || !data || !data.players || !data.players[nextMasterUid]) return;
            const updates = {
                secretWord: "",
                masterUid: nextMasterUid,
                masterName: data.players[nextMasterUid].nickname,
                hintState: null
            };
            if (incrementRound) updates.round = (data.round || 1) + 1;
            Object.keys(data.players).forEach(uid => {
                updates[`players/${uid}/guesses`] = [];
                updates[`players/${uid}/completed`] = (uid === nextMasterUid) || !!data.players[uid].spectator;
                updates[`players/${uid}/solvedTimestamp`] = 0;
            });
            db.ref(`rooms/${currentRoomCode}`).update(updates);
        }

        function nextRound() {
            if (!isMaster && !isHost) return;
            document.getElementById('gameOverModal').classList.add('hidden');
            if (!db || !currentRoomCode) return;
            db.ref(`rooms/${currentRoomCode}`).once('value', snapshot => {
                const data = snapshot.val();
                if (!data || !data.players) return;
                // 관전자는 출제자가 될 수 없으므로 제외하고 순서대로 다음 출제자를 정함
                const eligible = Object.keys(data.players).filter(uid => !data.players[uid].spectator);
                if (eligible.length === 0) return;
                const currentIndex = eligible.indexOf(data.masterUid);
                const nextMasterUid = eligible[(currentIndex + 1) % eligible.length];
                const expected = data.round || 1;
                // 출제자와 방장이 동시에 눌러도 한 번만 진행되도록 라운드 번호로 잠금
                db.ref(`rooms/${currentRoomCode}/round`).transaction(
                    cur => (cur === null) ? expected + 1 : (cur === expected ? expected + 1 : undefined),
                    (err, committed) => { if (committed) startRound(data, nextMasterUid, false); }
                );
            });
        }

        function resetGameData() {
            currentGuess = "";
            submittedGuesses = [];
            keyboardState = {};
            isGameOver = false;
            isResultsShown = false;
            solvedTimestamp = null;
            makerWord = "";
            hasMasterSetWord = false;
            document.getElementById('gameOverModal').classList.add('hidden');
            initBoard();
            renderBoard();
            syncMyProgress();
            updateHintButton();
        }

        // ═══════════════════════════════════════════════════════════════
        //  방 화면 공통 갱신 (방장 표시 / 방 관리·힌트 버튼 / 힌트 UI)
        // ═══════════════════════════════════════════════════════════════
        function updateRoomChrome(data) {
            const hostP = (data.players || {})[data.hostUid];
            document.getElementById('dispHostRow').classList.toggle('hidden', !data.hostUid);
            document.getElementById('dispHost').textContent = '👑 ' + (hostP ? hostP.nickname : (data.hostName || '알 수 없음'));

            if (!document.getElementById('hostModal').classList.contains('hidden')) renderHostPanel();
            handleHintState(data);
        }

        // ═══════════════════════════════════════════════════════════════
        //  방장 기능: 강퇴 / 출제자 변경
        // ═══════════════════════════════════════════════════════════════
        function openHostModal() {
            if (!isHost) return;
            renderHostPanel();
            document.getElementById('hostModal').classList.remove('hidden');
        }

        function closeHostModal() {
            document.getElementById('hostModal').classList.add('hidden');
        }

        function renderHostPanel() {
            const listEl = document.getElementById('hostPlayerList');
            const data = lastRoomData;
            if (!data || !data.players) { listEl.innerHTML = ''; return; }
            listEl.innerHTML = Object.entries(data.players).map(([uid, p]) => {
                const isSelf = uid === myUid;
                const isCurMaster = uid === data.masterUid;
                const badges =
                    (isCurMaster ? '<span class="ml-1 text-[10px] font-semibold text-emerald-600">출제자</span>' : '') +
                    (p.spectator ? '<span class="ml-1 text-[10px] font-semibold text-slate-500">관전</span>' : '') +
                    (isSelf ? '<span class="ml-1 text-[10px] text-slate-400">(나)</span>' : '');
                let btns = '';
                if (!p.spectator && !isCurMaster) {
                    btns += `<button data-uid="${escapeHtml(uid)}" onclick="hostSetMaster(this.dataset.uid)" class="px-2 py-1 bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-bold rounded-md">출제자 지정</button>`;
                }
                if (!isSelf) {
                    btns += `<button data-uid="${escapeHtml(uid)}" onclick="hostKick(this.dataset.uid)" class="px-2 py-1 bg-rose-600 hover:bg-rose-700 text-white text-[11px] font-bold rounded-md">강퇴</button>`;
                }
                return `<div class="flex items-center justify-between gap-2 p-2.5 rounded-lg border border-slate-200 bg-slate-50">
                    <div class="text-sm font-bold text-slate-700 truncate">${crown(uid)}${escapeHtml(p.nickname)}${badges}</div>
                    <div class="flex gap-1 shrink-0">${btns}</div>
                </div>`;
            }).join('');
        }

        function hostKick(uid) {
            if (!isHost || !db || !currentRoomCode || !lastRoomData) return;
            if (uid === myUid) return;
            if (uid === lastRoomData.masterUid) {
                showToast("현재 출제자는 강퇴할 수 없어요. 먼저 출제자를 변경해주세요.");
                return;
            }
            const p = (lastRoomData.players || {})[uid];
            if (!confirm(`${p ? p.nickname : '이 사용자'}님을 방에서 내보낼까요?\n(방 코드를 입력하면 다시 들어올 수 있어요.)`)) return;
            db.ref(`rooms/${currentRoomCode}`).update({
                [`players/${uid}`]: null,
                [`kicked/${uid}`]: true
            });
            showToast("방에서 내보냈어요.");
        }

        function hostSetMaster(uid) {
            if (!isHost || !db || !currentRoomCode || !lastRoomData || !lastRoomData.players) return;
            const p = lastRoomData.players[uid];
            if (!p || p.spectator || uid === lastRoomData.masterUid) return;
            if (!confirm(`출제자를 ${p.nickname}님으로 변경할까요?\n이번 라운드는 처음부터 다시 시작됩니다.`)) return;
            startRound(lastRoomData, uid, false);
            closeHostModal();
            showToast("출제자를 변경했습니다.");
        }

        // 강퇴당했을 때: 방에서 나가 혼자 하기 화면으로 돌아감
        function handleKicked() {
            if (db && currentRoomCode && roomDataListener) {
                db.ref(`rooms/${currentRoomCode}`).off('value', roomDataListener);
            }
            roomDataListener = null;
            leaveRoomLocal();
            alert("방장이 진행을 위해 방에서 내보냈어요. 필요하면 방 코드로 다시 입장할 수 있어요.");
        }

        function leaveRoomLocal() {
            currentRoomCode = null;
            isMaster = false; isSpectator = false; isHost = false;
            hostUid = null; lastRoomData = null; secretWord = "";
            if (hintTimer) { clearInterval(hintTimer); hintTimer = null; }
            ['hintModal', 'hostModal', 'gameOverModal', 'hintBanner', 'hintBar', 'multiplayerInfo', 'spectatorDashboard']
                .forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById('board').classList.remove('hidden');
            document.getElementById('keyboard').classList.remove('hidden');
            document.getElementById('gameModeBadge').textContent = "혼자 하기";
            document.getElementById('roomBtnText').textContent = "대결 방";
            resetGameData();
        }

        // ═══════════════════════════════════════════════════════════════
        //  힌트 투표: 요청 → 참가자 투표(자리 선택 / 거절) → 결과에 따라 글자 공개
        //   - 투표권: 문제를 아직 푸는 참가자 (출제자, 관전자, 이미 푼 사람은 제외)
        //   - 공개 조건: 자리 투표 합계가 거절표보다 "많을 때"만 공개 (동률이면 거절)
        //   - 공개 자리: 가장 표를 많이 받은 자리 (동률이면 앞쪽 자리)
        //   - 모두 투표하거나 제한 시간이 지나면 자동으로 마감
        // ═══════════════════════════════════════════════════════════════
        function getHintState() {
            return (lastRoomData && lastRoomData.hintState) || {};
        }

        function getRevealedIndexes(hs) {
            return Object.keys((hs && hs.revealed) || {})
                .map(k => parseInt(k.slice(1), 10)).filter(n => !isNaN(n)).sort((a, b) => a - b);
        }

        function isHintOpen() {
            const sess = getHintState().session;
            return !!sess && sess.status === 'open';
        }

        function isHintCooling(hs) {
            return !!hs.lastEnd && (serverNow() - hs.lastEnd) < HINT_COOLDOWN_SECONDS * 1000;
        }

        // 힌트 요청 버튼 / 방 관리 버튼 표시 상태
        function updateHintButton() {
            const btn = document.getElementById('hintReqBtn');
            const hostBtn = document.getElementById('hostBtn');
            const wrap = document.getElementById('roomActions');

            const show = !!currentRoomCode && !isMaster && !isSpectator && !isGameOver && !!secretWord;
            btn.classList.toggle('hidden', !show);
            if (show) {
                const hs = getHintState();
                const left = MAX_HINTS_PER_ROUND - getRevealedIndexes(hs).length;
                let enabled = true;
                let label = `💡 힌트 요청 (남은 ${left}회)`;
                if (left <= 0) { enabled = false; label = '💡 힌트를 모두 사용했어요'; }
                else if (isHintOpen()) { enabled = false; label = '💡 투표 진행 중...'; }
                else if (isHintCooling(hs)) {
                    const sec = Math.ceil((HINT_COOLDOWN_SECONDS * 1000 - (serverNow() - hs.lastEnd)) / 1000);
                    enabled = false; label = `💡 ${sec}초 후 요청 가능`;
                }
                btn.textContent = label;
                btn.disabled = !enabled;
                btn.className = 'px-3 py-1.5 text-white text-xs font-bold rounded-lg transition ' +
                    (enabled ? 'bg-indigo-600 hover:bg-indigo-700' : 'bg-slate-400 pointer-events-none');
            }
            hostBtn.classList.toggle('hidden', !isHost);
            wrap.classList.toggle('hidden', !(show || isHost));
        }

        // 공개된 힌트 글자 표시줄
        function renderHintBar(data) {
            const bar = document.getElementById('hintBar');
            const rev = getRevealedIndexes(data.hintState || {});
            if (rev.length === 0 || !data.secretWord) { bar.classList.add('hidden'); return; }
            let html = '<span class="text-xs font-bold text-indigo-700 mr-1">💡 힌트</span>';
            for (let i = 0; i < wordLength; i++) {
                const show = rev.includes(i);
                html += `<div class="w-7 h-7 rounded-md border flex items-center justify-center text-sm font-bold ${show ? 'bg-indigo-100 border-indigo-300 text-indigo-800' : 'bg-white border-slate-200 text-slate-300'}">${show ? escapeHtml(data.secretWord[i] || '') : '?'}</div>`;
            }
            bar.innerHTML = html;
            bar.classList.remove('hidden');
        }

        function requestHint() {
            const hs = getHintState();
            if (!db || !currentRoomCode || !lastRoomData || isMaster || isSpectator || isGameOver || !secretWord) return;
            if (isHintOpen()) { showToast("이미 힌트 투표가 진행 중이에요."); return; }
            if (getRevealedIndexes(hs).length >= MAX_HINTS_PER_ROUND) { showToast("이번 라운드 힌트를 모두 사용했어요."); return; }
            if (isHintCooling(hs)) { showToast("잠시 후에 다시 요청할 수 있어요."); return; }

            const voters = {};
            Object.entries(lastRoomData.players || {}).forEach(([uid, p]) => {
                if (uid !== lastRoomData.masterUid && !p.spectator && !p.completed) voters[uid] = true;
            });
            if (Object.keys(voters).length === 0) return;

            const id = Date.now() + '_' + Math.random().toString(36).slice(2, 6);
            db.ref(`rooms/${currentRoomCode}/hintState`).transaction(cur => {
                cur = cur || {};
                if (cur.session && cur.session.status === 'open') return;                       // 누가 먼저 요청함 → 취소
                if (Object.keys(cur.revealed || {}).length >= MAX_HINTS_PER_ROUND) return;
                cur.session = {
                    id, requesterUid: myUid, requesterName: myNickname, voters,
                    deadline: serverNow() + HINT_VOTE_SECONDS * 1000, status: 'open'
                };
                return cur;
            }, (err, committed) => {
                if (!committed) showToast("이미 진행 중인 힌트 투표가 있어요.");
            });
        }

        // v: 공개하고 싶은 자리(0부터) / -1: 거절
        function castHintVote(v) {
            if (!db || !currentRoomCode) return;
            const hs = getHintState();
            const sess = hs.session;
            if (!sess || sess.status !== 'open' || !sess.voters || !sess.voters[myUid]) return;
            if (v >= 0 && (hs.revealed || {})['p' + v]) return;   // 이미 공개된 자리
            db.ref(`rooms/${currentRoomCode}/hintState/session/votes/${myUid}`).set(v);
        }

        // 마감 조건(모두 투표 or 시간 초과)을 만족하면 결과를 확정. 누가 먼저 해도 한 번만 처리됨.
        function tryResolveHint() {
            const sess = getHintState().session;
            if (!db || !currentRoomCode || !sess || sess.status !== 'open') return;
            const voters = Object.keys(sess.voters || {});
            const votes = sess.votes || {};
            const allVoted = voters.length > 0 && voters.every(u => votes[u] !== undefined);
            if (!(allVoted || serverNow() >= sess.deadline)) return;

            db.ref(`rooms/${currentRoomCode}/hintState`).transaction(cur => {
                if (!cur) return cur;
                if (!cur.session || cur.session.id !== sess.id || cur.session.status !== 'open') return;   // 이미 처리됨
                const s = cur.session;
                const vs = s.voters || {};
                const vt = s.votes || {};
                const revealed = cur.revealed || {};
                let approve = 0, reject = 0;
                const tally = {};
                Object.keys(vs).forEach(u => {
                    const v = vt[u];
                    if (v === undefined || v === null) return;
                    if (v === -1) reject++;
                    else if (!revealed['p' + v]) { approve++; tally[v] = (tally[v] || 0) + 1; }
                });
                let result;
                if (approve + reject === 0) result = { type: 'none' };
                else if (reject >= approve) result = { type: 'reject' };
                else {
                    let best = -1, bestCnt = 0;
                    Object.keys(tally).map(Number).sort((a, b) => a - b).forEach(i => {
                        if (tally[i] > bestCnt) { bestCnt = tally[i]; best = i; }
                    });
                    result = { type: 'reveal', index: best };
                    cur.revealed = cur.revealed || {};
                    cur.revealed['p' + best] = true;
                }
                result.approve = approve; result.reject = reject;
                s.status = 'done';
                s.result = result;
                cur.lastEnd = serverNow();
                return cur;
            });
        }

        function setHintBanner(text, ms) {
            const b = document.getElementById('hintBanner');
            b.textContent = text;
            b.classList.remove('hidden');
            clearTimeout(hintBannerTimer);
            if (ms) hintBannerTimer = setTimeout(() => { if (!isHintOpen()) b.classList.add('hidden'); }, ms);
        }

        function announceHintResult(sess) {
            if (lastAnnouncedHintId === sess.id) return;
            lastAnnouncedHintId = sess.id;
            const r = sess.result || { type: 'none' };
            let text;
            if (r.type === 'reveal') {
                text = `💡 ${r.index + 1}번째 자리 '${secretWord[r.index] || '?'}' 공개! (찬성 ${r.approve} · 거절 ${r.reject})`;
            } else if (r.type === 'reject') {
                text = `🙅 힌트 요청이 거절됐어요 (찬성 ${r.approve} · 거절 ${r.reject})`;
            } else {
                text = '⌛ 투표가 없어 힌트가 공개되지 않았어요.';
            }
            showToast(text);
            setHintBanner(text, 8000);
        }

        function ensureHintTimer() {
            if (hintTimer) return;
            hintTimer = setInterval(() => {
                const hs = getHintState();
                const open = isHintOpen();
                if (open) { tryResolveHint(); renderHintVoteUI(); }
                updateHintButton();
                if (!open && !isHintCooling(hs)) { clearInterval(hintTimer); hintTimer = null; }
            }, 1000);
        }

        function handleHintState(data) {
            const hs = data.hintState || {};
            const sess = hs.session || null;
            if (!hintInitDone) {
                hintInitDone = true;
                if (sess && sess.status === 'done') lastAnnouncedHintId = sess.id;   // 입장 전에 끝난 투표는 다시 알리지 않음
            }
            renderHintBar(data);
            updateHintButton();

            if (sess && sess.status === 'open') {
                ensureHintTimer();
                renderHintVoteUI();
                tryResolveHint();
            } else {
                document.getElementById('hintModal').classList.add('hidden');
                if (sess && sess.status === 'done') {
                    announceHintResult(sess);
                    if (isHintCooling(hs)) ensureHintTimer();
                } else {
                    document.getElementById('hintBanner').classList.add('hidden');   // 새 라운드 등으로 힌트 정보가 사라짐
                }
            }
        }

        function dismissHintModal() {
            const sess = getHintState().session;
            if (sess) hintModalDismissedId = sess.id;
            document.getElementById('hintModal').classList.add('hidden');
        }

        function reopenHintModal() {
            hintModalDismissedId = null;
            renderHintVoteUI();
        }

        // 진행 중인 투표 화면 (배너는 모두에게, 투표창은 투표권이 있는 사람에게)
        function renderHintVoteUI() {
            const hs = getHintState();
            const sess = hs.session;
            if (!sess || sess.status !== 'open') return;

            const voters = Object.keys(sess.voters || {});
            const votes = sess.votes || {};
            const voted = voters.filter(u => votes[u] !== undefined).length;
            const remain = Math.max(0, Math.ceil((sess.deadline - serverNow()) / 1000));
            const amVoter = !!(sess.voters && sess.voters[myUid]) && !isMaster && !isSpectator;

            const banner = document.getElementById('hintBanner');
            banner.classList.remove('hidden');
            banner.textContent = `💡 ${sess.requesterName}님이 힌트를 요청했어요 · 투표 ${voted}/${voters.length}명 · ${remain}초` +
                (amVoter && hintModalDismissedId === sess.id ? ' (탭해서 투표하기)' : '');

            const modal = document.getElementById('hintModal');
            if (!amVoter || hintModalDismissedId === sess.id) { modal.classList.add('hidden'); return; }
            modal.classList.remove('hidden');

            document.getElementById('hintModalDesc').textContent =
                `${sess.requesterName}님이 힌트를 요청했어요. 공개하고 싶은 자리에 투표하거나 거절하세요. 거절표가 같거나 더 많으면 공개되지 않아요.`;
            document.getElementById('hintModalStatus').textContent = `투표 ${voted}/${voters.length}명 · 남은 시간 ${remain}초`;

            const revealed = hs.revealed || {};
            const sig = JSON.stringify([sess.id, votes, revealed, wordLength]);
            if (sig === hintRenderSig) return;     // 바뀐 게 없으면 버튼을 다시 그리지 않음 (탭 도중 사라짐 방지)
            hintRenderSig = sig;

            const myVote = votes[myUid];
            const counts = {};
            let rejectCnt = 0;
            voters.forEach(u => {
                const v = votes[u];
                if (v === undefined) return;
                if (v === -1) rejectCnt++; else counts[v] = (counts[v] || 0) + 1;
            });
            let html = '<div class="grid grid-cols-4 gap-2">';
            for (let i = 0; i < wordLength; i++) {
                if (revealed['p' + i]) {
                    html += `<div class="py-2 rounded-xl border border-slate-200 bg-slate-100 text-slate-400 text-center text-xs font-bold">${i + 1}번째<br><span class="text-[10px]">공개됨</span></div>`;
                } else {
                    const mine = myVote === i;
                    html += `<button onclick="castHintVote(${i})" class="py-2 rounded-xl border text-xs font-bold transition ${mine ? 'bg-indigo-600 border-indigo-600 text-white' : 'bg-white border-slate-300 text-slate-700 hover:bg-indigo-50'}">${i + 1}번째<br><span class="text-[10px] font-semibold">${counts[i] || 0}표</span></button>`;
                }
            }
            html += '</div>';
            html += `<button onclick="castHintVote(-1)" class="w-full mt-3 py-2.5 rounded-xl border text-sm font-bold transition ${myVote === -1 ? 'bg-rose-600 border-rose-600 text-white' : 'bg-white border-rose-300 text-rose-600 hover:bg-rose-50'}">🙅 거절 (${rejectCnt}표)</button>`;
            document.getElementById('hintVoteControls').innerHTML = html;
        }

        // 초기화
        initBoard();
