        .tile {
            width: 52px; height: 52px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; font-weight: 700; border-radius: 0.75rem;

        .tile.present { background-color: #facc15 !important; border-color: #facc15 !important; color: white !important; }
        .tile.absent { background-color: #94a3b8 !important; border-color: #94a3b8 !important; color: white !important; }

<script>
        const firebaseConfig = {
            apiKey: "AIzaSyBZmxJUr5oaZttF7oIYJSEBb5RgjVQjInY",
            authDomain: "cofirm-board.firebaseapp.com",
            databaseURL: "https://cofirm-board-default-rtdb.firebaseio.com",
            projectId: "cofirm-board",
            storageBucket: "cofirm-board.appspot.com",
            messagingSenderId: "367825644618",
            appId: "1:367825644618:web:3f236c72c0d5347878ab3"
        };
const CHARS='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣㄳㄵㄶㄺㄻㄼㄽㄾㄿㅀㅄ';
function score(guess,answer){
 const marks=Array(5).fill('absent'), left={};
 for(let i=0;i<5;i++)if(guess[i]===answer[i])marks[i]='correct';else left[answer[i]]=(left[answer[i]]||0)+1;
 for(let i=0;i<5;i++)if(marks[i]!=='correct'&&left[guess[i]]>0){marks[i]='present';left[guess[i]]--;}
 return marks;
}
function rankings(r){return Object.entries(r.contestants||{}).map(([id,p])=>({id,...p})).sort((a,b)=>Number(b.solved)-Number(a.solved)||(a.solved?(a.guesses.length-b.guesses.length||a.finishOrder-b.finishOrder):0));}
function finish(r,now){if(r.phase==='playing'&&Object.values(r.contestants||{}).every(p=>p.done)){r.phase='results';r.endsAt=now;r.advanceAt=now+8000;}return r;}
function transition(original,id,action,now){
 if(!original)throw Error('방이 없습니다. 코드를 확인해주세요.');
 const r=JSON.parse(JSON.stringify(original));r.players=r.players||{};
 if(action.type==='join'){
  if(!r.players[id]){r.order=(r.order||0)+1;r.players[id]={nickname:action.name,order:r.order};}
  else r.players[id].nickname=action.name;
  return r;
 }
 if(!r.players[id])throw Error('방에 먼저 참가해주세요.');
 if(action.round!==r.round)throw Error('라운드가 바뀌었습니다. 다시 입력해주세요.');
 if(action.type==='start'){
  if(r.masterUid!==id||r.phase!=='setting')throw Error('현재 출제자만 출제할 수 있습니다.');
  if(action.word.length!==5||[...action.word].some(c=>!CHARS.includes(c)))throw Error('자음·모음 5칸을 채워주세요.');
  const ids=Object.keys(r.players).filter(x=>x!==id);if(!ids.length)throw Error('참가자가 한 명 이상 들어온 뒤 출제해주세요.');
  r.secretWord=action.word;r.phase='playing';r.startedAt=now;r.sequence=0;r.contestants={};
  ids.forEach(x=>r.contestants[x]={nickname:r.players[x].nickname,guesses:[],done:false,solved:false});return r;
 }
 if(action.type==='guess'||action.type==='giveup'){
  const p=r.contestants?.[id];if(r.phase!=='playing'||!p||p.done)throw Error('지금은 제출할 수 없습니다.');
  p.guesses=p.guesses||[];
  if(action.type==='giveup'){p.done=true;p.gaveUp=true;return finish(r,now);}
  if(p.guesses.length!==action.expected)throw Error('이미 제출된 입력입니다.');
  if(action.word.length!==5||[...action.word].some(c=>!CHARS.includes(c)))throw Error('자음·모음 5칸을 채워주세요.');
  p.guesses.push(action.word);r.sequence=(r.sequence||0)+1;
  p.solved=action.word===r.secretWord;p.done=p.solved||p.guesses.length>=5;
  if(p.solved){p.finishOrder=r.sequence;p.finishedAt=now;}
  return finish(r,now);
 }
 if(action.type==='next'){
  if(r.phase!=='results'||now<r.advanceAt)return;
  const ids=Object.keys(r.players).sort((a,b)=>r.players[a].order-r.players[b].order),i=ids.indexOf(r.masterUid);
  r.masterUid=ids[(i+1)%ids.length];r.round++;r.phase='setting';delete r.contestants;delete r.secretWord;delete r.advanceAt;return r;
 }
 if(action.type==='leave'){
  if(r.contestants?.[id]&&!r.contestants[id].done){r.contestants[id].done=true;r.contestants[id].gaveUp=true;}
  delete r.players[id];const ids=Object.keys(r.players).sort((a,b)=>r.players[a].order-r.players[b].order);
  if(!ids.length)return null;
  if(r.masterUid===id){r.masterUid=ids[0];if(r.phase==='setting'){delete r.secretWord;} }
  return finish(r,now);
 }
 throw Error('알 수 없는 요청입니다.');
}
if(typeof module!=='undefined')module.exports={score,transition,rankings};

session=session||{id:'p_'+crypto.randomUUID()};const uid=session.id;

persist();
function showToast(s){$('toast').textContent=s;$('toast').classList.remove('opacity-0');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').classList.add('opacity-0'),4000);}
function error(e){showToast(e.code==='PERMISSION_DENIED'?'Firebase에서 접근을 거부했습니다. 데이터베이스 규칙 확인이 필요합니다.':e.message||String(e));}
function openLobbyModal(){if(code){showToast('현재 방을 나간 뒤 다른 방에 참가할 수 있어요.');return;}$('lobbyModal').classList.remove('hidden');}
function closeLobbyModal(){$('lobbyModal').classList.add('hidden');}
function showJoinInput(){$('joinCodeArea').classList.remove('hidden');}
function now(){return Date.now()+offset;}
function ref(){return db.ref('wordDuelsV2/'+code);}
async function transact(action){
 if(!connected)throw Error('서버 연결을 기다려주세요.');
 const target=ref();let failure;
 const result=await target.transaction(value=>{failure=null;try{return transition(value,uid,action,now());}catch(e){failure=e;return;}},undefined,false);
 if(failure)throw failure;return result;
}
function nickname(){const n=$('nicknameInput').value.trim();if(!n||n.length>16)throw Error('닉네임을 1~16자로 입력해주세요.');return n;}
async function createRoom(){
 if(busy)return;busy=true;
 try{if(!db||!connected)throw Error('서버 연결을 기다려주세요.');const name=nickname();
 for(let i=0;i<10;i++){const n=String(100000+crypto.getRandomValues(new Uint32Array(1))[0]%900000);
 const result=await db.ref('wordDuelsV2/'+n).transaction(v=>v?undefined:{phase:'setting',round:1,masterUid:uid,order:1,players:{[uid]:{nickname:name,order:1}}},undefined,false);
 if(result.committed){enter(n,name);return;}}
 throw Error('방 생성에 실패했습니다. 다시 시도해주세요.');
 }catch(e){error(e);}finally{busy=false;render();}
}
async function joinRoom(){
 if(busy)return;busy=true;
 try{if(!db||!connected)throw Error('서버 연결을 기다려주세요.');const name=nickname(),n=$('roomCodeInput').value.trim();if(!/^\d{6}$/.test(n))throw Error('6자리 방 코드를 입력해주세요.');
 let fail;const result=await db.ref('wordDuelsV2/'+n).transaction(v=>{try{return transition(v,uid,{type:'join',name},now());}catch(e){fail=e;return;}},undefined,false);
 if(!result.committed)throw fail||Error('방 참가에 실패했습니다.');enter(n,name);
 }catch(e){error(e);}finally{busy=false;render();}
}
function enter(n,name){
 if(listener&&code)ref().off('value',listener);code=n;session.code=n;session.name=name;persist();closeLobbyModal();
 listener=snap=>{const value=snap.val();if(!value||!value.players?.[uid]){reset();showToast('방이 종료되었거나 참가 정보가 없습니다.');return;}
 if(oldRound!==value.round||room?.phase!==value.phase){input='';oldRound=value.round;}room=value;
 Object.values(room.contestants||{}).forEach(p=>p.guesses=p.guesses||[]);render();};ref().on('value',listener,error);
}
function reset(){if(listener&&code)ref().off('value',listener);code=null;room=null;input='';oldRound=null;delete session.code;persist();render();}
async function leaveRoom(){if(!code)return;if(!confirm('방을 나갈까요? 진행 중인 도전은 포기 처리됩니다.'))return;try{await transact({type:'leave',round:room.round});reset();}catch(e){error(e);}}
function canInput(){return connected&&!busy&&room&&(room.phase==='setting'?room.masterUid===uid:room.phase==='playing'&&room.contestants?.[uid]&&!room.contestants[uid].done);}
function handleKey(c){if(canInput()&&input.length<5){input+=c;render();}}
function handleDelete(){if(canInput()){input=input.slice(0,-1);render();}}
async function handleSubmit(){
 if(!canInput())return;if(input.length!==5){showToast('자음·모음 5칸을 모두 채워주세요.');return;}
 const action={type:room.phase==='setting'?'start':'guess',round:room.round,word:input,expected:room.contestants?.[uid]?.guesses.length||0};
 busy=true;render();try{await transact(action);input='';}catch(e){error(e);}finally{busy=false;render();}
}
async function giveUp(){if(!room||!confirm('이번 라운드를 포기할까요?'))return;try{await transact({type:'giveup',round:room.round});}catch(e){error(e);}}
function el(tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e;}
function render(){
 $('gameModeBadge').textContent=room?'대결 모드':'친구와 대결';$('roomBtnText').textContent=code||'대결 방';
 $('connection').textContent=connected?'● 서버 연결됨':'● 서버 연결 중 · 입력 대기';
 $('multiplayerInfo').classList.toggle('hidden',!room);$('leaveBtn').classList.toggle('hidden',!room);
 $('board').replaceChildren();$('playerStatusList').replaceChildren();$('gameOverModal').classList.add('hidden');
 const maker=room?.masterUid===uid,p=room?.contestants?.[uid],guesses=p?.guesses||[];
 let message='대결 방을 만들거나 6자리 코드로 참가하세요.';
 if(room){$('dispRoomCode').textContent=code+' · '+room.round+'라운드';$('dispMaster').textContent=room.players[room.masterUid]?.nickname||'';
 if(room.phase==='setting')message=maker?'자음·모음 5칸을 클릭하고 정답 제출을 누르세요.':'출제자가 문제를 준비하고 있어요.';
 else if(room.phase==='playing')message=maker&&!p?'참가자들이 도전 중이에요.':!p?'이번 라운드는 관전 · 다음 라운드부터 참가해요.':p.done?(p.solved?'정답! 다른 참가자의 도전이 끝나면 순위가 확정돼요.':'도전 종료 · 다른 참가자를 기다려주세요.'):`총 5번의 기회 · ${guesses.length+1}번째 도전`;
 else message='라운드 종료 · 잠시 후 다음 출제자로 넘어가요.';
 }
 $('statusText').textContent=message;$('masterNotice').classList.add('hidden');
 const editing=maker&&room?.phase==='setting';const known=room?.secretWord||'';
 for(let i=0;i<5;i++){const row=el('div','','grid grid-cols-5 gap-2');let word=guesses[i]||(i===guesses.length&&canInput()?input:'');
 if(editing)word=i===0?input:'';else if(maker&&!p)word=i===0?known:'';
 const marks=guesses[i]?score(guesses[i],known):[];
 for(let j=0;j<5;j++)row.append(el('div',word[j]||'','tile '+(marks[j]||((editing||maker&&!p)&&i===0?'maker-input':''))));$('board').append(row);}
 const colors={};guesses.forEach(g=>score(g,known).forEach((s,i)=>{const priority={absent:1,present:2,correct:3};if((priority[s]||0)>(priority[colors[g[i]]]||0))colors[g[i]]=s;}));
 document.querySelectorAll('[data-char]').forEach(k=>{k.className='key '+(colors[k.dataset.char]||'');k.disabled=!canInput();});
 $('submitBtn').textContent=busy?'저장 중…':editing?'정답 제출':'제출';$('submitBtn').disabled=!canInput();$('deleteKey').disabled=!canInput();
 $('giveup').classList.toggle('hidden',!(room?.phase==='playing'&&p&&!p.done));
 $('spectatorDashboard').classList.toggle('hidden',!room);
 if(room)Object.entries(room.players).sort((a,b)=>a[1].order-b[1].order).forEach(([id,user])=>{
 const player=room.contestants?.[id];let status=id===room.masterUid?'출제자':player?(player.solved?`${player.guesses.length}회 정답`:player.done?'도전 종료':`${player.guesses.length}/5회 도전`):room.phase==='setting'?'준비 완료':'다음 라운드 대기';
 $('playerStatusList').append(el('div',`${user.nickname}${id===uid?' (나)':''} · ${status}`,'text-sm py-1'));});
 $('results').replaceChildren();
 if(room?.phase==='results'){
 $('results').append(el('h3','라운드 결과','text-xl font-bold'),el('p','정답: '+known,'text-sm my-2'));
 const rows=rankings(room);rows.forEach((v,i)=>$('results').append(el('p',`${v.solved?i+1+'위':'—'} ${v.nickname} · ${v.solved?v.guesses.length+'회 정답':v.gaveUp?'포기':'5회 실패'}`,'py-1')));
 if(!rows.some(v=>v.solved))$('results').append(el('p','이번 라운드는 정답자가 없어요.'));
 $('results').append(el('p','같은 횟수는 서버 제출 접수 순으로 판정합니다.','text-xs mt-3'));}
}
let advancing=false;
setInterval(async()=>{if(room?.phase==='results'&&now()>=room.advanceAt&&connected&&!advancing){advancing=true;try{await transact({type:'next',round:room.round});}catch(e){error(e);}finally{advancing=false;}}},1000);
window.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(e.key==='Enter'){e.preventDefault();handleSubmit();}if(e.key==='Backspace'){e.preventDefault();handleDelete();}});
try{if(!window.firebase)throw Error('Firebase 스크립트를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해주세요.');firebase.initializeApp(firebaseConfig);db=firebase.database();
 db.ref('.info/serverTimeOffset').on('value',s=>offset=s.val()||0);
 db.ref('.info/connected').on('value',s=>{connected=s.val()===true;render();});
 if(session.code)enter(session.code,session.name);else render();
}catch(e){render();$('connection').textContent=e.message;}

</script></body></html>
